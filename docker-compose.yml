services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: waste_sorting
      MYSQL_USER: waste_app
      MYSQL_PASSWORD: waste_password
      MYSQL_ROOT_PASSWORD: root_password
    healthcheck:
      # A TCP query with the application credentials waits for the *final*
      # server and database, not MySQL's socket-only first-run init server.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -Nse 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    restart: on-failure
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: waste_app
      DB_PASSWORD: waste_password
      DB_NAME: waste_sorting
      OPENAI_API_KEY_FILE: /run/secrets/ai_api_key
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set a long random FLASK_SECRET_KEY in your local .env}
    secrets:
      - ai_api_key
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:

secrets:
  ai_api_key:
    file: ${OPENAI_API_KEY_FILE:?Set OPENAI_API_KEY_FILE in your local .env}
